# Pushing a version tag such as v0.1.0 publishes a release: it runs the tests,
# builds mgit for Linux, macOS and Windows (amd64 and arm64) with the version
# stamped in, writes SHA-256 checksums, and creates a GitHub Release whose
# notes are that version's section of CHANGELOG.md. See CONTRIBUTING.md,
# "Releasing".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build the binaries and checksums
        run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Take the release notes from CHANGELOG.md
        # The tag is v0.1.0; its changelog heading is "## [0.1.0] - <date>".
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $prerelease \
            --title "mini-git $GITHUB_REF_NAME" --notes-file notes.md
