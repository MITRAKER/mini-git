# OpenSSF Scorecard grades the project's supply-chain security practices
# (branch protection, pinned dependencies, token permissions, code review,
# and more) and publishes the score shown by the badge in the README.
# Findings appear in the repository's Security tab.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6" # every Saturday
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload the results to code scanning
      id-token: write # to publish the results for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
