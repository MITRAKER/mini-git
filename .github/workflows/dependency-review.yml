# Dependency review checks every pull request for new dependencies with known
# vulnerabilities, and stops the pull request if it would add one. mini-git
# uses only Go's standard library today, so this guards the future.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
